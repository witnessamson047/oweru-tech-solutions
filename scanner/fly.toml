# Fly.io config for the scanner engine — run `fly launch` from INSIDE the
# scanner/ directory so the Docker build context is this folder.
# Johannesburg (jnb) is the closest Fly region to Tanzania.
app = "oweru-scanner-engine"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  SCANNER_PORT = "5000"
  # Set the shared secret once, after launch:
  #   fly secrets set SCANNER_API_KEY=<same value as in Vercel>

[http_service]
  internal_port = 5000
  force_https = true
  # Always-on: scheduled scrapes and public scans must never wait for a
  # cold boot. (Set auto_stop_machines = "stop" + auto_start_machines = true
  # instead to save money — first request then waits ~10-20s.)
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="Oweru">
  <defs>
    <style>
      .word { font-family: 'Inter', 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 86px; font-weight: 700; letter-spacing: 1px; fill: #0f172a; }
      .ring { fill: none; stroke: #c89128; stroke-width: 15; }
      .pulse { fill: none; stroke: #0f172a; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #3376bd; }
    </style>
  </defs>

  <!-- Ring mark -->
  <circle class="ring" cx="80" cy="80" r="56"/>

  <!-- Health pulse across the ring -->
  <polyline class="pulse" points="36,80 60,80 72,54 92,106 104,80 124,80"/>

  <!-- Signal node on the ring -->
  <circle class="node" cx="80" cy="24" r="9"/>

  <!-- Wordmark -->
  <text class="word" x="176" y="109">oweru</text>
</svg>
